name: Build Plugin

on:
  push:
    branches:
      - main
      - fix-special-characters-in-api-call
    tags-ignore:
      - '**'

  workflow_dispatch:

permissions: 
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  PLUGIN_NAME: Lidarr.Plugin.Qobuz
  PLUGIN_VERSION: 10.1.0.${{ github.run_number }}
  MINIMUM_LIDARR_VERSION: 3.0.0.4855
  DOTNET_VERSION: 8.0.405

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        framework:
          - net8.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate branch metadata
        id: gen_meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Update Version Info
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${PLUGIN_VERSION}"
          else
            VERSION="10.1.0.${{ github.run_number }}"
          fi

          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$VERSION<\/AssemblyVersion>/g" src/Directory.Build.props

          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${{ steps.gen_meta.outputs.branch }}<\/AssemblyConfiguration>/g" src/Directory.Build.props

          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props

      - name: Build
        run: |
          dotnet restore src/*.sln --property:TreatWarningsAsErrors=false
          dotnet build src/*.sln -c Release -f ${{ matrix.framework }} --property:TreatWarningsAsErrors=false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}
          path: ./_plugins/net8.0/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.*

      - name: Generate Changelog
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Changelog:" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0)..HEAD | awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt

      - name: Display Changelog
        if: github.ref == 'refs/heads/main'
        run: cat changelog.txt

      - name: Install 7zip
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-special-characters-in-api-call'
        run: |
          sudo apt update
          sudo apt install -y p7zip-full

      - name: Zip Plugin
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix-special-characters-in-api-call'
        run: |
          7z a -tzip "${PLUGIN_NAME}.net8.0.zip" \
            "./_plugins/net8.0/${PLUGIN_NAME}/${PLUGIN_NAME}.*"

      - name: Create Development Release
        if: github.ref == 'refs/heads/fix-special-characters-in-api-call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dev-${{ github.run_number }}"
          name: "Development build ${{ github.run_number }}"
          body: |
            Development build from branch:

            `${{ github.ref_name }}`

            Commit:
            `${{ github.sha }}`

            This is a test build and is not intended for the main plugin release.
          draft: false
          prerelease: true
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip

      - name: Create Main Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_VERSION }}
          body_path: changelog.txt
          draft: true
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.net8.0.zip
